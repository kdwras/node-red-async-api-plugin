<!-- ========================================================= -->
<!-- Node-RED Editor Template -->
<!-- ========================================================= -->

<script type="text/html" data-template-name="async-api-red">

    <style>
        .asyncapi-section {
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 4px;
            background: #fafafa;
        }

        .asyncapi-section-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }

        #node-parameters-display .form-row,
        #node-messages-display .form-row {
            margin-top: 6px;
        }

        #node-messages-display {
            max-height: 250px;
            overflow-y: auto;
        }

        #node-parameters-display {
            max-height: 150px;
            overflow-y: auto;
        }
    </style>

    <!-- Node name -->
    <div class="form-row">
        <label for="node-input-name">
            <i class="fa fa-tag"></i> Name
        </label>
        <input type="text" id="node-input-name">
    </div>

    <!-- AsyncAPI File Upload -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            AsyncAPI Specification
        </div>

        <div class="form-row">
            <label for="node-input-file">
                <i class="fa fa-file"></i> File
            </label>
            <input type="file"
                   id="node-input-file"
                   accept=".yaml,.yml,.json">
        </div>
    </div>

    <!-- Server Selection -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            Server Configuration
        </div>

        <div class="form-row">
            <label for="node-input-select-server">
                <i class="fa fa-server"></i> Server
            </label>
            <select id="node-input-select-server" style="width:100%"></select>
        </div>
    </div>

    <!-- Channel Selection -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            Channel
        </div>

        <div class="form-row">
            <label for="node-input-channel">
                <i class="fa fa-exchange"></i> Channel
            </label>
            <select id="node-input-channel" style="width:100%"></select>
        </div>
    </div>

    <!-- Operation Selection -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            Operation
        </div>

        <div class="form-row">
            <label for="node-input-operations">
                <i class="fa fa-cogs"></i> Operation
            </label>
            <select id="node-input-operations" style="width:100%"></select>
        </div>
    </div>

    <!-- Channel Parameters -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            Channel Parameters
        </div>

        <div id="node-parameters-display">
            <i style="color:#888">Parameters will appear here</i>
        </div>
    </div>

    <!-- Message Payload Fields -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            Message Payload
        </div>

        <div id="node-messages-display">
            <i style="color:#888">Message schema fields will appear here</i>
        </div>
    </div>

</script>


<!-- ========================================================= -->
<!-- Node Help -->
<!-- ========================================================= -->

<script type="text/html" data-help-name="async-api-red">
    <p>
        This node loads an <b>AsyncAPI specification</b>, allows the user to select
        a server, channel and operation, and dynamically generates parameter and
        payload input fields based on the AsyncAPI document.
    </p>

    <p>
        The selected configuration is saved in the node and is reused when the
        node is reopened.
    </p>
</script>


<script type="text/javascript">
    (function () {

        /**
         * =====================================================================
         * GLOBAL EDITOR STATE
         * =====================================================================
         * This object exists only inside the browser editor.
         * It stores:
         * - the current node id
         * - the parsed AsyncAPI data returned by the backend
         * - the user's current selections and input values
         *
         * It is reset every time the editor dialog opens or closes.
         */
        const state = {
            nodeId: null,

            asyncApiData: {
                servers: [],
                channels: []
            },

            selections: {
                serverUrl: "",
                topic: "",
                operationId: "",
                parameterValues: {},
                payloadValues: {}
            }
        };

        /**
         * =====================================================================
         * NODE REGISTRATION
         * =====================================================================
         * Register the custom node in the Node-RED editor palette.
         */
        RED.nodes.registerType("async-api-red", {
            category: "network",
            color: "rgb(136 81 251)",

            /**
             * These fields are persisted by Node-RED in the flow JSON.
             * They are also passed to the runtime file on deploy.
             */
            defaults: {
                name: { value: "" },
                serverUrl: { value: "" },
                topic: { value: "" },
                operation: { value: null },
                expectedPayload: { value: [] },
                parameters: { value: [] },
                parameterValues: { value: {} },
                payload: { value: {} }
            },

            inputs: 1,
            outputs: 1,
            icon: "white-globe.svg",

            /**
             * Label shown on the workspace node.
             */
            label: function () {
                return this.name || "AsyncApi-red";
            },

            /**
             * =================================================================
             * oneditprepare
             * =================================================================
             * Called when the user opens the node edit dialog.
             *
             * Main flow:
             * 1. Reset local editor state
             * 2. Bind UI event handlers
             * 3. If node has not been deployed yet, stop here
             * 4. Load uploaded AsyncAPI file
             * 5. Load parsed AsyncAPI data from backend
             * 6. Load saved user selections
             * 7. Render all UI fields
             */
            oneditprepare: function () {
                const node = this;

                resetEditorState();
                resetUi();
                clearFileInput();

                state.nodeId = node.id || null;

                bindStaticEvents();

                /**
                 * New nodes do not have a stable runtime id before first deploy.
                 * Since uploads and backend routes depend on node id,
                 * the user must deploy once before using the file upload.
                 */
                if (!node?.id) {
                    $("#node-messages-display").html(
                        "<div style='color:#666'>Deploy the flow once, then reopen this node to upload and configure the AsyncAPI file.</div>"
                    );
                    return;
                }

                subscribeRuntimeEvents(node.id);

                Promise.resolve()
                    .then(() => getFile(node.id).catch(() => null))
                    .then(() => getData(node.id))
                    .then((data) => {
                        state.asyncApiData = normalizeAsyncApiData(data);
                        return getUserSelections(node.id).catch(() => ({}));
                    })
                    .then((saved) => {
                        applySavedSelections(saved || {});
                        ensureValidSelections();
                        renderAll();
                    })
                    .catch((err) => {
                        console.error("Editor init failed:", err);
                        RED.notify("Failed to initialize AsyncAPI editor", "error");
                    });
            },

            /**
             * =================================================================
             * oneditsave
             * =================================================================
             * Called when the user presses the "Done" button.
             *
             * Main flow:
             * 1. Read latest values from UI
             * 2. Build the final node configuration
             * 3. Save the configuration to the runtime/backend
             * 4. Trigger MQTT connect and message initialization
             */
            oneditsave: function () {
                const node = this;

                if (!node?.id) {
                    return;
                }

                syncStateFromUi();

                const selectedChannel = getSelectedChannel();
                const selectedOperation = getSelectedOperation();

                if (!selectedChannel || !selectedOperation) {
                    RED.notify("Select a channel and operation first.", "warning");
                    return;
                }

                /**
                 * Build the complete configuration object that will be saved
                 * in both the editor-side node instance and the backend runtime node.
                 */
                const data = {
                    serverUrl: state.selections.serverUrl,
                    topic: selectedChannel.address,
                    operation: selectedOperation,
                    expectedPayload: getExpectedPayloadFromOperation(selectedOperation),
                    parameters: Array.isArray(selectedChannel.parameters) ? selectedChannel.parameters : [],
                    parameterValues: getParameterValuesFromUi(),
                    payload: getPayloadValuesFromUi()
                };

                /**
                 * Update the editor-side node object so Node-RED persists these values.
                 */
                node.serverUrl = data.serverUrl;
                node.topic = data.topic;
                node.operation = data.operation;
                node.expectedPayload = data.expectedPayload;
                node.parameters = data.parameters;
                node.parameterValues = data.parameterValues;
                node.payload = data.payload;

                /**
                 * Save configuration to backend, connect runtime node to MQTT,
                 * initialize topic/message handling, then unsubscribe from
                 * temporary editor runtime events.
                 */
                return saveUserSelections(node.id, data)
                    .then(() => connectToServer(node.id))
                    .then(() => handleMessage(node.id, selectedChannel.address))
                    .then(() => unsubscribeRuntimeEvents(node.id))
                    .catch((err) => {
                        console.error("Failed during save/connect flow:", err);
                        RED.notify("Failed to save selections or connect to MQTT server", "error");
                    });
            },

            /**
             * Called when the user closes the dialog without saving.
             * Clean up editor-only subscriptions and state.
             */
            oneditcancel: function () {
                if (state.nodeId) {
                    unsubscribeRuntimeEvents(state.nodeId);
                }

                resetEditorState();
                resetUi();
                clearFileInput();
            }
        });

        /**
         * =====================================================================
         * BACKEND API CALLS
         * =====================================================================
         * These functions call routes exposed from router.js.
         * The editor never parses AsyncAPI directly. It always asks the backend.
         */

        /**
         * Load the uploaded AsyncAPI file from the backend and
         * repopulate the file input in the editor.
         *
         * @param {string} nodeId
         * @returns {Promise<object>}
         */
        function getFile(nodeId) {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: `/async-api-red/${nodeId}/file`,
                    type: "GET",
                    success: function (response) {
                        try {
                            const blob = new Blob([response.fileContent], { type: "text/plain" });
                            const file = new File([blob], response.fileName, { type: response.fileType });

                            const dataTransfer = new DataTransfer();
                            dataTransfer.items.add(file);

                            $("#node-input-file")[0].files = dataTransfer.files;

                            resolve(response);
                        } catch (e) {
                            reject(e);
                        }
                    },
                    error: reject
                });
            });
        }

        /**
         * Upload a new AsyncAPI file to the backend for the current node.
         * After upload succeeds, reload AsyncAPI metadata and rerender the UI.
         *
         * @param {string} nodeId
         * @param {File} file
         */
        function uploadFile(nodeId, file) {
            const formData = new FormData();
            formData.append("file", file);

            $.ajax({
                url: `/async-api-red/${nodeId}/file`,
                type: "POST",
                data: formData,
                processData: false,
                contentType: false,

                success: function () {
                    getData(nodeId).then((data) => {
                        state.asyncApiData = normalizeAsyncApiData(data);
                        ensureValidSelections();
                        renderAll();
                    });
                },

                error: function () {
                    RED.notify("File upload failed", "error");
                }
            });
        }

        /**
         * Request parsed AsyncAPI data from backend.
         * Expected response: servers, channels, operations, parameters, messages.
         *
         * @param {string} nodeId
         * @returns {Promise<object>}
         */
        function getData(nodeId) {
            return new Promise((resolve, reject) => {
                $.ajax({
                    type: "GET",
                    url: `/async-api-red/${nodeId}/data`,
                    success: resolve,
                    error: reject
                });
            });
        }

        /**
         * Save the user's selected values to the backend/runtime node.
         *
         * @param {string} nodeId
         * @param {object} data
         * @returns {jqXHR}
         */
        function saveUserSelections(nodeId, data) {
            return $.ajax({
                url: `/async-api-red/${nodeId}/user-selections`,
                type: "POST",
                contentType: "application/json",
                data: JSON.stringify(data)
            });
        }

        /**
         * Read previously saved selections from backend/runtime node.
         *
         * @param {string} nodeId
         * @returns {Promise<object>}
         */
        function getUserSelections(nodeId) {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: `/async-api-red/${nodeId}/user-selections`,
                    type: "GET",
                    success: resolve,
                    error: reject
                });
            });
        }

        /**
         * Ask backend/runtime node to connect to MQTT server.
         *
         * @param {string} nodeId
         * @returns {Promise<object>}
         */
        function connectToServer(nodeId) {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: `/async-api-red/${nodeId}/server-connect`,
                    type: "GET",
                    success: resolve,
                    error: reject
                });
            });
        }

        /**
         * Ask backend/runtime node to initialize topic/message logic.
         *
         * @param {string} nodeId
         * @param {string} topicName
         * @returns {Promise<object>}
         */
        function handleMessage(nodeId, topicName) {
            return new Promise((resolve, reject) => {
                $.ajax({
                    url: `/async-api-red/${nodeId}/message`,
                    type: "POST",
                    contentType: "application/json",
                    data: JSON.stringify({ topic: topicName }),
                    success: resolve,
                    error: reject
                });
            });
        }

        /**
         * =====================================================================
         * DATA NORMALIZATION / STATE RESTORE
         * =====================================================================
         */

        /**
         * Normalize backend response to avoid undefined values.
         *
         * @param {object} data
         * @returns {{servers: Array, channels: Array}}
         */
        function normalizeAsyncApiData(data) {
            return {
                servers: Array.isArray(data?.servers) ? data.servers : [],
                channels: Array.isArray(data?.channels) ? data.channels : []
            };
        }

        /**
         * Restore previously saved selections into local editor state.
         *
         * @param {object} saved
         */
        function applySavedSelections(saved) {
            state.selections.serverUrl = saved.serverUrl || "";
            state.selections.topic = saved.topic || "";
            state.selections.operationId = saved.operation?.id || "";
            state.selections.parameterValues = saved.parameterValues || {};
            state.selections.payloadValues = saved.payload || {};
        }

        /**
         * Ensure restored selections still exist in the loaded AsyncAPI document.
         * If not, fallback to the first available server/channel/operation.
         */
        function ensureValidSelections() {
            if (!state.asyncApiData.servers.length || !state.asyncApiData.channels.length) {
                return;
            }

            const serverExists = state.asyncApiData.servers.some(
                (server) => server.url === state.selections.serverUrl
            );

            if (!serverExists) {
                state.selections.serverUrl = state.asyncApiData.servers[0]?.url || "";
            }

            const channelExists = state.asyncApiData.channels.some(
                (channel) => channel.address === state.selections.topic
            );

            if (!channelExists) {
                state.selections.topic = state.asyncApiData.channels[0]?.address || "";
            }

            const channel = getSelectedChannel();

            const operationExists = channel?.operations?.some(
                (operation) => operation.id === state.selections.operationId
            );

            if (!operationExists) {
                state.selections.operationId = channel?.operations?.[0]?.id || "";
            }
        }

        /**
         * Reset all visible UI containers.
         */
        function resetUi() {
            $("#node-input-select-server").empty();
            $("#node-input-channel").empty();
            $("#node-input-operations").empty();
            $("#node-parameters-display").empty();
            $("#node-messages-display").empty();
        }

        /**
         * =====================================================================
         * UI EVENT BINDINGS
         * =====================================================================
         * Attach all editor-side event listeners.
         * We use .off(...).on(...) to avoid duplicated handlers when dialog reopens.
         */
        function bindStaticEvents() {

            /**
             * File input change -> upload selected file to backend.
             */
            $("#node-input-file")
                .off("change.asyncapi")
                .on("change.asyncapi", function (event) {
                    const file = event.target.files[0];

                    if (file && state.nodeId) {
                        uploadFile(state.nodeId, file);
                    }
                });

            /**
             * Server dropdown change -> store selected server URL in state.
             */
            $("#node-input-select-server")
                .off("change.asyncapi")
                .on("change.asyncapi", function () {
                    state.selections.serverUrl = $(this).val() || "";
                });

            /**
             * Channel dropdown change:
             * - update selected topic
             * - reset selected operation to first available one in that channel
             * - rerender operation/parameter/message sections
             */
            $("#node-input-channel")
                .off("change.asyncapi")
                .on("change.asyncapi", function () {
                    state.selections.topic = $(this).val() || "";

                    const channel = getSelectedChannel();
                    state.selections.operationId = channel?.operations?.[0]?.id || "";

                    renderOperations();
                    renderParameters();
                    renderMessages();
                    applySelectionsToUi();
                });

            /**
             * Operation dropdown change -> rerender payload fields.
             */
            $("#node-input-operations")
                .off("change.asyncapi")
                .on("change.asyncapi", function () {
                    state.selections.operationId = $(this).val() || "";
                    renderMessages();
                });

            /**
             * Parameter input typing -> update state immediately.
             */
            $("#node-parameters-display")
                .off("input.asyncapi")
                .on("input.asyncapi", "input[id^='node-input-param-']", function () {
                    const name = this.id.replace("node-input-param-", "");
                    state.selections.parameterValues[name] = $(this).val() || "";
                });

            /**
             * Payload input typing -> update state immediately.
             */
            $("#node-messages-display")
                .off("input.asyncapi")
                .on("input.asyncapi", "input[id^='node-input-']:not([id^='node-input-param-'])", function () {
                    const name = this.id.replace("node-input-", "");
                    state.selections.payloadValues[name] = $(this).val() || "";
                });
        }

        /**
         * =====================================================================
         * RUNTIME COMMUNICATION
         * =====================================================================
         * The editor listens to runtime events published from async-api-red.js.
         */

        /**
         * Subscribe to runtime events for the current node.
         *
         * Events:
         * - payload-update: runtime resolved payload/parameters
         * - payload-error: validation/runtime errors
         *
         * @param {string} nodeId
         */
        function subscribeRuntimeEvents(nodeId) {
            RED.comms.subscribe(`async-api-red/payload-update/${nodeId}`, function (topic, msg) {

                /**
                 * Update payload inputs in the dialog with runtime values.
                 */
                if (msg?.payload && typeof msg.payload === "object") {
                    Object.entries(msg.payload).forEach(([key, value]) => {
                        const input = $(`#node-input-${key}`);

                        if (input.length) {
                            input.val(value);
                        }
                    });
                }

                /**
                 * Update parameter inputs in the dialog with runtime values.
                 */
                if (msg?.parameters && typeof msg.parameters === "object") {
                    Object.entries(msg.parameters).forEach(([key, value]) => {
                        const input = $(`#node-input-param-${key}`);

                        if (input.length) {
                            input.val(value);
                        }
                    });
                }
            });

            RED.comms.subscribe(`async-api-red/payload-error/${nodeId}`, function (topic, msg) {
                RED.notify(`❌ Validation Error: ${msg.error}`, "error");
            });
        }

        /**
         * Remove runtime subscriptions when dialog closes.
         *
         * @param {string} nodeId
         */
        function unsubscribeRuntimeEvents(nodeId) {
            if (RED.comms && typeof RED.comms.unsubscribe === "function") {
                RED.comms.unsubscribe(`async-api-red/payload-update/${nodeId}`);
                RED.comms.unsubscribe(`async-api-red/payload-error/${nodeId}`);
            }
        }

        /**
         * =====================================================================
         * STATE / SELECTION HELPERS
         * =====================================================================
         */

        /**
         * Read the latest selected values from the UI into state.
         */
        function syncStateFromUi() {
            state.selections.serverUrl = $("#node-input-select-server").val() || "";
            state.selections.topic = $("#node-input-channel").val() || "";
            state.selections.operationId = $("#node-input-operations").val() || "";
            state.selections.parameterValues = getParameterValuesFromUi();
            state.selections.payloadValues = getPayloadValuesFromUi();
        }

        /**
         * Return the currently selected channel object from loaded AsyncAPI data.
         *
         * @returns {object|undefined}
         */
        function getSelectedChannel() {
            return state.asyncApiData.channels.find(
                (channel) => channel.address === state.selections.topic
            );
        }

        /**
         * Return the currently selected operation object from the selected channel.
         *
         * @returns {object|undefined}
         */
        function getSelectedOperation() {
            const channel = getSelectedChannel();

            return channel?.operations?.find(
                (operation) => operation.id === state.selections.operationId
            );
        }

        /**
         * Render every dynamic UI section.
         */
        function renderAll() {
            renderServers();
            renderChannels();
            renderOperations();
            renderParameters();
            renderMessages();
            applySelectionsToUi();
        }

        /**
         * =====================================================================
         * RENDERING FUNCTIONS
         * =====================================================================
         */

        /**
         * Render MQTT server dropdown from AsyncAPI servers.
         */
        function renderServers() {
            const serverDropdown = $("#node-input-select-server");
            serverDropdown.empty();

            state.asyncApiData.servers.forEach((server) => {
                serverDropdown.append(
                    `<option value="${escapeHtml(server.url)}">${escapeHtml(server.url)}</option>`
                );
            });
        }

        /**
         * Render channel dropdown from AsyncAPI channels.
         */
        function renderChannels() {
            const channelDropdown = $("#node-input-channel");
            channelDropdown.empty();

            state.asyncApiData.channels.forEach((channel) => {
                channelDropdown.append(
                    `<option value="${escapeHtml(channel.address)}">${escapeHtml(channel.address)}</option>`
                );
            });
        }

        /**
         * Render operation dropdown for the selected channel.
         */
        function renderOperations() {
            const operationDropdown = $("#node-input-operations");
            operationDropdown.empty();

            const selectedChannel = getSelectedChannel();

            if (!selectedChannel || !Array.isArray(selectedChannel.operations) || !selectedChannel.operations.length) {
                return;
            }

            selectedChannel.operations.forEach((operation) => {
                operationDropdown.append(
                    `<option value="${escapeHtml(operation.id)}">${escapeHtml(operation.id)}</option>`
                );
            });
        }

        /**
         * Render channel parameter input fields for the selected channel.
         * Prefill them from saved state if values already exist.
         */
        function renderParameters() {
            const container = $("#node-parameters-display");
            container.empty();

            const selectedChannel = getSelectedChannel();
            const parameters = selectedChannel?.parameters || [];

            if (!parameters.length) {
                container.append("<div>No parameters available for this channel.</div>");
                return;
            }

            parameters.forEach((param) => {
                const name = param.id || param.name;
                const savedValue = state.selections.parameterValues?.[name] ?? "";

                container.append(`
                    <div class="form-row">
                        <label>${escapeHtml(name)}</label>
                        <input id="node-input-param-${escapeHtml(name)}" value="${escapeHtml(String(savedValue))}">
                    </div>
                `);
            });
        }

        /**
         * Render payload fields for the selected AsyncAPI operation.
         * Prefill them from saved state if values already exist.
         */
        function renderMessages() {
            const container = $("#node-messages-display");
            container.empty();

            const selectedOperation = getSelectedOperation();

            if (!selectedOperation || !Array.isArray(selectedOperation.messages) || !selectedOperation.messages.length) {
                container.append("<div>No message payload fields available for this operation.</div>");
                return;
            }

            selectedOperation.messages.forEach((message) => {
                if (!Array.isArray(message.payload) || !message.payload.length) {
                    return;
                }

                message.payload.forEach((field) => {
                    if (!field || !field.name) {
                        return;
                    }

                    const savedValue = state.selections.payloadValues?.[field.name] ?? "";

                    container.append(`
                        <div class="form-row">
                            <label>${escapeHtml(field.name)}</label>
                            <input id="node-input-${escapeHtml(field.name)}" value="${escapeHtml(String(savedValue))}">
                        </div>
                    `);
                });
            });
        }

        /**
         * Restore selected dropdown values to the UI after rendering.
         */
        function applySelectionsToUi() {
            $("#node-input-select-server").val(state.selections.serverUrl);
            $("#node-input-channel").val(state.selections.topic);
            $("#node-input-operations").val(state.selections.operationId);
        }

        /**
         * =====================================================================
         * PAYLOAD / PARAMETER EXTRACTION
         * =====================================================================
         */

        /**
         * Extract expected payload field definitions from the selected operation.
         * This metadata is later saved in the node configuration and used by runtime validation.
         *
         * @param {object} operation
         * @returns {Array}
         */
        function getExpectedPayloadFromOperation(operation) {
            const fields = [];

            if (!operation || !operation.messages) {
                return fields;
            }

            const messages = Array.isArray(operation.messages)
                ? operation.messages
                : Object.values(operation.messages);

            for (const message of messages) {
                const payload =
                    Array.isArray(message?.payload) ? message.payload :
                        Array.isArray(message?.message?.payload) ? message.message.payload :
                            [];

                for (const field of payload) {
                    fields.push(field);
                }
            }

            return fields;
        }

        /**
         * Collect payload values from payload inputs currently shown in the UI.
         *
         * @returns {object}
         */
        function getPayloadValuesFromUi() {
            const values = {};

            $("#node-messages-display")
                .find("input[id^='node-input-']")
                .each(function () {
                    const name = this.id.replace("node-input-", "");
                    values[name] = $(this).val() || "";
                });

            return values;
        }

        /**
         * Collect parameter values from parameter inputs currently shown in the UI.
         *
         * @returns {object}
         */
        function getParameterValuesFromUi() {
            const values = {};

            $("#node-parameters-display")
                .find("input[id^='node-input-param-']")
                .each(function () {
                    const name = this.id.replace("node-input-param-", "");
                    values[name] = $(this).val() || "";
                });

            return values;
        }

        /**
         * =====================================================================
         * UTILITY FUNCTIONS
         * =====================================================================
         */

        /**
         * Reset local editor state so a new node does not inherit data
         * from a previously opened node dialog.
         */
        function resetEditorState() {
            state.nodeId = null;
            state.asyncApiData = {
                servers: [],
                channels: []
            };
            state.selections = {
                serverUrl: "",
                topic: "",
                operationId: "",
                parameterValues: {},
                payloadValues: {}
            };
        }

        /**
         * Clear file input value.
         * Useful when dialog closes or is reopened.
         */
        function clearFileInput() {
            $("#node-input-file").val("");
        }

        /**
         * Escape text before placing it inside HTML.
         * Prevents broken markup and avoids simple HTML injection issues.
         *
         * @param {string} value
         * @returns {string}
         */
        function escapeHtml(value) {
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/"/g, "&quot;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;");
        }

    })();
</script>
