<!-- ========================================================= -->
<!-- Node-RED Editor Template -->
<!-- ========================================================= -->

<script type="text/html" data-template-name="async-api-red">

    <style>
        .asyncapi-section {
            border: 1px solid #ddd;
            padding: 12px;
            margin-bottom: 12px;
            border-radius: 4px;
            background: #fafafa;
        }

        .asyncapi-section-title {
            font-weight: 600;
            margin-bottom: 8px;
            color: #444;
        }

        #node-parameters-display .form-row,
        #node-messages-display .form-row {
            margin-top: 6px;
        }

        #node-messages-display {
            max-height: 250px;
            overflow-y: auto;
        }

        #node-parameters-display {
            max-height: 150px;
            overflow-y: auto;
        }
    </style>

    <!-- Node name -->
    <div class="form-row">
        <label for="node-input-name">
            <i class="fa fa-tag"></i> Name
        </label>
        <input type="text" id="node-input-name">
    </div>

    <!-- AsyncAPI File -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            AsyncAPI Specification
        </div>

        <div class="form-row">
            <label for="node-input-file">
                <i class="fa fa-file"></i> File
            </label>
            <input type="file"
                   id="node-input-file"
                   accept=".yaml,.yml,.json">
        </div>
    </div>

    <!-- Server Selection -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            Server Configuration
        </div>

        <div class="form-row">
            <label for="node-input-select-server">
                <i class="fa fa-server"></i> Server
            </label>
            <select id="node-input-select-server" style="width:100%"></select>
        </div>
    </div>

    <!-- Channel -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            Channel
        </div>

        <div class="form-row">
            <label for="node-input-channel">
                <i class="fa fa-exchange"></i> Channel
            </label>
            <select id="node-input-channel" style="width:100%"></select>
        </div>
    </div>

    <!-- Operation -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            Operation
        </div>

        <div class="form-row">
            <label for="node-input-operations">
                <i class="fa fa-cogs"></i> Operation
            </label>
            <select id="node-input-operations" style="width:100%"></select>
        </div>
    </div>

    <!-- Parameters -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            Channel Parameters
        </div>

        <div id="node-parameters-display">
            <i style="color:#888">Parameters will appear here</i>
        </div>
    </div>

    <!-- Messages -->
    <div class="asyncapi-section">
        <div class="asyncapi-section-title">
            Message Payload
        </div>

        <div id="node-messages-display">
            <i style="color:#888">Message schema fields will appear here</i>
        </div>
    </div>

</script>


<!-- ========================================================= -->
<!-- Node Help -->
<!-- ========================================================= -->

<script type="text/html" data-help-name="async-api-red">
    <p>
        This node loads an <b>AsyncAPI specification</b>, allows the user to select
        a server, channel and operation, and dynamically generates parameter and
        payload fields from the AsyncAPI document.
    </p>

    <p>
        The selected values are saved and restored when the node is reopened.
    </p>
</script>

<!-- Bundled editor script -->
<script type="text/javascript" src="/async-api-red/assets/editor.bundle.js"></script>
